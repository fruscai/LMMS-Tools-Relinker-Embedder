<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LMMS Tools</title>
<style>
  :root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;
        --text-dim:#a8b3bd;--text-faint:#7d8590;--warn:#d29922;--accent:#2f81f7;--radius-sm:6px}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column}
  header{flex:0 0 auto;background:#010409;border-bottom:1px solid #21262d;padding:14px 16px 0}
  .brand{font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--text-faint);margin-bottom:12px}
  .attribution{display:flex;align-items:flex-start;gap:10px;margin:0 0 14px;padding:11px 14px;
    border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:var(--radius-sm);
    background:var(--panel);color:var(--text-dim);font-size:12.5px;line-height:1.6}
  .attribution strong{color:var(--text);font-weight:600}
  .attribution .who{color:var(--text);font-weight:600}
  .attribution .id{color:var(--text-faint);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .tabs{display:flex;gap:4px}
  .tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
       color:var(--text-faint);font:inherit;font-weight:500;padding:10px 14px;cursor:pointer}
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
  .panes{position:relative;flex:1 1 auto;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
  iframe[hidden]{display:none}
</style>
</head>
<body>
<header>
  <div class="brand">LMMS Tools</div>
  <div class="tabs">
    <button type="button" class="tab" data-pane="pane-relink" aria-selected="true">Relink</button>

  </div>
</header>
<div class="panes">

Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
